name: Coletar ofertas

on:
  schedule:
    # 6h20, 11h20 e 17h20 de Brasília (UTC-3), 30 min antes de cada bloco do agente
    - cron: "20 9,14,20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar coletor
        env:
          AWIN_FEEDLIST: ${{ secrets.AWIN_FEEDLIST }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: python coletor/coletar.py

      - name: Salvar resultado
        run: |
          git config user.name "pacepreco-bot"
          git config user.email "pacepreco@gmail.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sem mudanças"
          else
            git commit -m "ofertas $(TZ=America/Sao_Paulo date +'%d/%m %H:%M')"
            git push
          fi
